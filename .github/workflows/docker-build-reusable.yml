# =============================================================================
# 재사용 가능한 Docker 빌드/푸시 워크플로우
#
# 목적:
#   - 호출한 워크플로우에서 전달받은 이미지 목록을 매트릭스로 병렬 빌드/푸시
#   - Docker Hub에 이미지를 자동으로 배포
#
# 입력:
#   - images: 빌드할 이미지 정보 JSON 배열
#     예: [{"tag":"humble-desktop","repo":"hhanoo/ros","path":"ros/humble/desktop"}]
#     선택 필드 source_repo / source_ref 로 다른 저장소를 빌드 대상으로 지정 가능
#   - runner: 실행 환경 (기본값: ubuntu-latest)
#
# 시크릿:
#   - DOCKERHUB_USERNAME: Docker Hub 사용자명
#   - DOCKERHUB_TOKEN: Docker Hub 액세스 토큰
#   - SOURCE_REPO_TOKEN: 비공개 소스 저장소 체크아웃용 읽기 전용 토큰 (선택)
#
# 참고:
#   - 이 파일은 workflow_call 기반 reusable workflow임
#   - 빌드 컨텍스트는 각 이미지의 Dockerfile이 위치한 디렉토리
#   - source_repo 를 생략하면 호출한 저장소를 체크아웃함
# =============================================================================
name: Reusable Docker Build

# =============================================================================
# 워크플로우 실행 조건
# - 다른 워크플로우에서 workflow_call로 호출될 때 실행
# - 빌드할 이미지 목록과 Docker Hub 인증 정보를 전달받음
# =============================================================================
on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON array of images to build.
          Each element: {"tag": "...", "repo": "...", "path": "..."}
        required: true
        type: string
      runner:
        description: Runner label for build jobs
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub username
        required: true
      DOCKERHUB_TOKEN:
        description: Docker Hub access token
        required: true
      SOURCE_REPO_TOKEN:
        description: Read-only token for checking out a private source repository
        required: false

jobs:
  build:
    # =========================================================================
    # 실행 환경
    # - 기본값은 ubuntu-latest (현재 Ubuntu 24.04)
    # - 호출한 워크플로우에서 runner 입력값으로 덮어쓸 수 있음
    # =========================================================================
    runs-on: ${{ inputs.runner }}

    # =========================================================================
    # 매트릭스 전략
    # - 호출 측에서 전달한 이미지 목록을 매트릭스로 병렬 빌드
    # - 하나의 이미지 빌드 실패가 다른 빌드에 영향을 주지 않도록 fail-fast 비활성화
    # =========================================================================
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.images) }}

    steps:
      # =======================================================================
      # 1단계: 소스 코드 체크아웃
      # - source_repo 가 있으면 해당 저장소를, 없으면 호출한 저장소를 체크아웃
      # - source_ref 가 없으면 체크아웃 액션의 기본 참조를 사용
      # - SOURCE_REPO_TOKEN 이 없으면 GITHUB_TOKEN 으로 대체 (공개 저장소는 이것으로 충분)
      # =======================================================================
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.source_repo || github.repository }}
          ref: ${{ matrix.source_ref || '' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN || github.token }}

      # =======================================================================
      # 2단계: Docker Buildx 설정
      # - 고급 빌드 기능(캐시 등)을 사용하기 위해 Buildx를 활성화
      # =======================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # =======================================================================
      # 3단계: Docker Hub 로그인
      # - 시크릿으로 전달받은 인증 정보를 사용
      # =======================================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =======================================================================
      # 4단계: Docker 이미지 빌드 및 푸시
      # - 각 이미지의 path 디렉토리를 빌드 컨텍스트로 사용
      # - 레지스트리 캐시를 활용해 빌드 시간 단축
      # - provenance: false → 불필요한 attestation 비활성화 (디스크 절약)
      # =======================================================================
      - name: Build and push ${{ matrix.repo }}:${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: ${{ matrix.repo }}:${{ matrix.tag }}
          provenance: false
          cache-from: type=registry,ref=${{ matrix.repo }}:${{ matrix.tag }}
          cache-to: type=inline
